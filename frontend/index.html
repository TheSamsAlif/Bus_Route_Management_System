<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>গন্তব্য BD - Smart Bus Route & Fare Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="particles" id="particles"></div>

  <div id="splash-screen">
    <div class="splash-bg"></div>
    <div class="splash-content">
      <div class="splash-icon"><i class="fas fa-bus"></i></div>
      <h1>গন্তব্য BD</h1>
      <p>স্মার্ট বাস রুট ও ভাড়া ম্যানেজমেন্ট</p>
      <div class="splash-loader"><div class="splash-loader-bar"></div></div>
      <div class="splash-credit">DEVELOPED BY SAMS ALIF</div>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="glass-header">
      <div class="logo"><i class="fas fa-bus"></i><span>গন্তব্য BD</span></div>
      <div class="header-right">
        <button class="icon-btn" id="theme-toggle"><i class="fas fa-moon"></i></button>
        <button class="icon-btn" id="lang-toggle"><i class="fas fa-language"></i></button>
        <button class="icon-btn" id="notif-btn"><i class="fas fa-bell"></i><span class="notification-badge">0</span></button>
        <div class="user-btn" id="user-btn"><i class="fas fa-user"></i></div>
      </div>
    </header>

    <main class="main-content" id="main-content"></main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-page="home"><i class="fas fa-home"></i><span>হোম</span></button>
      <button class="nav-item" data-page="routes"><i class="fas fa-route"></i><span>রুট</span></button>
      <button class="nav-item" data-page="buses"><i class="fas fa-bus"></i><span>বাস</span></button>
      <button class="nav-item" data-page="calculator"><i class="fas fa-calculator"></i><span>ভাড়া</span></button>
      <button class="nav-item" data-page="favorites"><i class="fas fa-heart"></i><span>পছন্দ</span></button>
      <button class="nav-item" data-page="profile"><i class="fas fa-user"></i><span>প্রোফাইল</span></button>
    </nav>

    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-box" id="modal-box">
        <button class="modal-close" id="modal-close"><i class="fas fa-times"></i></button>
        <div id="modal-content"></div>
      </div>
    </div>

    <div class="auth-modal" id="auth-modal">
      <div class="auth-box">
        <button class="auth-close" id="auth-close"><i class="fas fa-times"></i></button>
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">লগিন</button>
          <button class="auth-tab" data-tab="register">রেজিস্টার</button>
        </div>
        <div class="auth-demo-quick-box">
          <div class="demo-box-label"><i class="fas fa-bolt" style="color:#00F2FE"></i> ১-ক্লিক ডেমো অ্যাকাউন্ট অ্যাক্সেস:</div>
          <div class="demo-btn-row">
            <button type="button" class="modal-demo-btn user" onclick="directDemoLogin('user')">
              <span class="m-demo-role"><i class="fas fa-user"></i> সাধারণ যাত্রী</span>
              <span class="m-demo-creds">ইউজার: <b>user</b> | <b>user123</b></span>
            </button>
            <button type="button" class="modal-demo-btn student" onclick="directDemoLogin('student')">
              <span class="m-demo-role" style="color:#00F5A0"><i class="fas fa-graduation-cap"></i> শিক্ষার্থী ডেমো</span>
              <span class="m-demo-creds">ইউজার: <b>student</b> | <b>student123</b></span>
            </button>
            <button type="button" class="modal-demo-btn admin" onclick="directDemoLogin('admin')">
              <span class="m-demo-role" style="color:#fbbf24"><i class="fas fa-crown"></i> অ্যাডমিন</span>
              <span class="m-demo-creds">ইউজার: <b>ADMIN</b> | <b>admin123</b></span>
            </button>
          </div>
        </div>
        <form class="auth-form" id="auth-form">
          <div class="fg" id="name-fg" style="display:none">
            <label>নাম</label>
            <input type="text" name="name" placeholder="আপনার নাম">
          </div>
          <div class="fg">
            <label>ইউজারনেম</label>
            <input type="text" name="username" placeholder="ইউজারনেম" required>
          </div>
          <div class="fg">
            <label>পাসওয়ার্ড</label>
            <input type="password" name="password" placeholder="পাসওয়ার্ড" required>
          </div>
          
          <!-- Student Verification Toggle & Upload Fields (Visible only in Register tab) -->
          <div id="student-reg-box" style="display:none;margin-bottom:14px">
            <div style="background:rgba(0,242,254,0.06);border:1px solid rgba(0,242,254,0.25);border-radius:14px;padding:12px;margin-bottom:10px">
              <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;font-weight:700;color:#00F2FE">
                <input type="checkbox" id="reg-is-student" name="isStudent" onchange="toggleStudentRegFields(this.checked)">
                <span>🎓 আমি একজন শিক্ষার্থী (৫০% হাফ পাস চাই)</span>
              </label>
            </div>
            
            <div id="student-doc-fields" style="display:none;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px">
              <div class="fg" style="margin-bottom:10px">
                <label>শিক্ষা প্রতিষ্ঠানের নাম <span style="color:#00F2FE">*</span></label>
                <input type="text" id="reg-institution" name="institution" placeholder="যেমন: ঢাকা বিশ্ববিদ্যালয়, বুয়েট, ঢাকা কলেজ">
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
                <div class="fg" style="margin-bottom:0">
                  <label>রোল / স্টুডেন্ট আইডি <span style="color:#00F2FE">*</span></label>
                  <input type="text" id="reg-student-id" name="studentId" placeholder="যেমন: DU-2022-89">
                </div>
                <div class="fg" style="margin-bottom:0">
                  <label>বিভাগ / ক্লাস</label>
                  <input type="text" id="reg-dept" name="department" placeholder="যেমন: সিএসই / ১২তম">
                </div>
              </div>
              <div class="fg" style="margin-bottom:0">
                <label>📄 স্টুডেন্ট আইডি কার্ড / ডকুমেন্ট আপলোড <span style="color:#00F2FE">*</span></label>
                <input type="file" id="reg-doc-file" accept="image/*,.pdf" onchange="handleDocFileUpload(event)" style="padding:8px;font-size:12px">
                <div id="doc-preview-badge" style="display:none;margin-top:8px;font-size:11px;color:#00F5A0">
                  <i class="fas fa-check-circle"></i> <span id="doc-preview-name">ডকুমেন্ট সংযুক্ত হয়েছে</span>
                </div>
              </div>
            </div>
          </div>

          <button type="submit" class="auth-submit"><span>লগিন</span> <i class="fas fa-arrow-right"></i></button>
        </form>
      </div>
    </div>

    <div id="toast-container"></div>

    <div id="offline-banner" class="offline-banner hidden">
      <i class="fas fa-wifi-slash"></i> আপনি অফলাইনে আছেন — কিছু তথ্য দেখানো সম্ভব নয়
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
